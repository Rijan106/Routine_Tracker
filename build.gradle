plugins {
    id 'com.android.application'
}

android {
    namespace 'com.routinetracker.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.routinetracker.app'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'routine-tracker'
            keyAlias 'routine'
            keyPassword 'routine-tracker'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
